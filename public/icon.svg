<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="boatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8"/>

  <!-- Water Speed Waves -->
  <path d="M 60 380 Q 160 350 260 380 T 460 380" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.4" stroke-linecap="round"/>
  <path d="M 80 415 Q 180 395 280 415 T 440 415" fill="none" stroke="#0284c7" stroke-width="6" opacity="0.6" stroke-linecap="round"/>

  <!-- Racing Boat Silhouette -->
  <path d="M 120 330 L 370 295 L 430 335 L 360 345 L 140 345 Z" fill="url(#boatGrad)" filter="url(#glow)"/>
  <circle cx="270" cy="275" r="28" fill="#f8fafc"/>
  <!-- Helmet visor -->
  <path d="M 270 268 Q 295 273 285 285 Q 265 285 270 268 Z" fill="#0284c7"/>

  <!-- K5 Emblem & PRO Badge -->
  <text x="256" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="128" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-2" filter="url(#glow)">K5</text>
  <rect x="156" y="222" width="200" height="34" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
  <text x="256" y="246" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#fef08a" text-anchor="middle" letter-spacing="4">ANALYZER PRO</text>

  <!-- 5 Points (5 Stars representing 本命5点型予想) -->
  <g fill="url(#goldGrad)" transform="translate(136, 100)">
    <!-- 5 stars evenly spaced -->
    <polygon points="20,0 25,12 38,12 28,20 32,32 20,24 8,32 12,20 2,12 15,12" />
    <polygon points="70,0 75,12 88,12 78,20 82,32 70,24 58,32 62,20 52,12 65,12" />
    <polygon points="120,-6 125,6 138,6 128,14 132,26 120,18 108,26 112,14 102,6 115,6" transform="scale(1.1) translate(-10, -2)"/>
    <polygon points="170,0 175,12 188,12 178,20 182,32 170,24 158,32 162,20 152,12 165,12" />
    <polygon points="220,0 225,12 238,12 228,20 232,32 220,24 208,32 212,20 202,12 215,12" />
  </g>
</svg>
